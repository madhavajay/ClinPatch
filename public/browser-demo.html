<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ClinPatch GRCh38 Browser Demo</title>
    <style>
      body {
        margin: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button {
        height: 36px;
      }

      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #111;
        color: #e7f8ef;
        padding: 14px;
        min-height: 320px;
      }
    </style>
  </head>
  <body>
    <h1>ClinPatch GRCh38 Browser Demo</h1>
    <button id="run">Fetch BRCA1 GRCh38 From Raw GitHub</button>
    <pre id="out">Ready.</pre>

    <script src="../js/clinpatch.global.js"></script>
    <script>
      const out = document.querySelector("#out");
      const run = document.querySelector("#run");

      run.addEventListener("click", async () => {
        out.textContent = "Fetching...";
        const client = new ClinPatch.ClinPatchClient({
          assembly: "GRCh38",
          rawBase: "https://raw.githubusercontent.com/madhavajay/ClinPatch/main/public/chunks-brca1",
          geneIndexUrl: "https://raw.githubusercontent.com/madhavajay/ClinPatch/main/public/genes/gencode.v50.GRCh38.genes.json",
        });

        const rows = [];
        for await (const row of client.queryGene("BRCA1", {
          start: 43044293,
          end: 43045642,
          format: "json",
          limit: 5,
        })) {
          rows.push({
            id: row.id,
            location: `${row.chrom}:${row.pos}`,
            allele: `${row.ref}>${row.alt}`,
            significance: row.info.CLNSIG || "",
            raw: row.raw,
          });
        }

        out.textContent = JSON.stringify(rows, null, 2);
      });
    </script>
  </body>
</html>
